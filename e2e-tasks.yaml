tasks:
  - id: docker-sdk
    title: "Copy .docker-sdk from sec-af and fix Dockerfile references"
    kind: shell
    priority: 10
    description: |
      Copy code/examples/sec-af/.docker-sdk/ to code/examples/contract-af/.docker-sdk/
      Update Dockerfile to reference .docker-sdk/ instead of agentfield-sdk/
      This SDK is needed for Docker builds (contains the agentfield Python SDK).
      Also add extra deps: fastapi, uvicorn, python-docx, pdfplumber

  - id: dockerfile-local
    title: "Create Dockerfile.local for local development"
    kind: code
    priority: 9
    deps: [{ task: docker-sdk, kind: feeds_into }]
    description: |
      Create Dockerfile.local mirroring sec-af/Dockerfile.local pattern.
      Key differences from sec-af:
        - Port 8004 (not 8003)
        - User contractaf (not secaf)
        - Model kimi-k2.5 default
        - Include fastapi, uvicorn, python-docx, pdfplumber deps
        - Entry: python -m contract_af.app
        - No prompts/ directory to copy (contract-af doesn't have one)

  - id: compose-local
    title: "Create docker-compose.local.yml"
    kind: code
    priority: 9
    deps: [{ task: dockerfile-local, kind: feeds_into }]
    description: |
      Create docker-compose.local.yml mirroring sec-af pattern.
      Connects to host CP at http://host.docker.internal:9090
      Port mapping 8004:8004
      Uses Dockerfile.local
      Env: OPENROUTER_API_KEY, HARNESS_MODEL, AI_MODEL

  - id: env-file
    title: "Create .env with OpenRouter keys"
    kind: shell
    priority: 10
    description: |
      Create .env with OPENROUTER_API_KEY from sec-af/.env
      Set HARNESS_MODEL and AI_MODEL to kimi-k2.5
      Set AGENTFIELD_SERVER to localhost:9090

  - id: legal-doc
    title: "Download realistic legal contract for e2e testing"
    kind: research
    priority: 8
    description: |
      Find and download ONE realistic multi-page legal contract.
      Options:
        - CUAD dataset on HuggingFace (Contract Understanding Atticus Dataset)
        - SEC EDGAR filings with actual contracts
        - GitHub repos with sample legal documents
      Save to tests/fixtures/real_contract.txt
      Must be text-extractable, multi-page, with complex clauses.

  - id: test-harness
    title: "Create test_harness.py for e2e contract analysis"
    kind: code
    priority: 7
    deps: [{ task: docker-sdk, kind: feeds_into }, { task: legal-doc, kind: feeds_into }]
    description: |
      Create test_harness.py mirroring sec-af/test_harness.py pattern.
      Tests:
        1. Simple intake classification (short prompt, IntakeResult schema)
        2. Full pipeline on sample_nda.txt fixture
        3. Full pipeline on real_contract.txt
        4. Concurrent analysis (2x parallel contract analysis)
      Uses HarnessRunner from agentfield SDK.
      Model: openrouter/moonshotai/kimi-k2.5
      Reports timing, findings count, risk scores, cost estimate.
      IMPORTANT: Do NOT use LSP-based analysis for code checking.
      Use py_compile or static analysis (ruff/pycompile) since the folder is large.

  - id: docker-build
    title: "Build Docker image and verify"
    kind: shell
    priority: 6
    deps: [{ task: docker-sdk, kind: feeds_into }, { task: dockerfile-local, kind: feeds_into }, { task: compose-local, kind: feeds_into }, { task: env-file, kind: feeds_into }]
    description: |
      Build the Docker image using docker-compose.local.yml.
      Verify it starts, health check passes.
      Use: docker compose -f docker-compose.local.yml build
      Then: docker compose -f docker-compose.local.yml up -d
      Check health: curl http://localhost:8004/health

  - id: e2e-test
    title: "Run e2e test and quantify performance"
    kind: test
    priority: 5
    deps: [{ task: docker-build, kind: feeds_into }, { task: test-harness, kind: feeds_into }]
    description: |
      Run the test_harness.py inside the Docker container.
      Capture: timing, findings count, risk scores, cost.
      Save results to exampl/ directory (matching sec-af pattern).
      Format: JSON with benchmark metrics.

  - id: save-results
    title: "Save e2e results and update README"
    kind: code
    priority: 4
    deps: [{ task: e2e-test, kind: feeds_into }]
    description: |
      Save benchmark results to exampl/ directory.
      Create exampl/result.json with full analysis output.
      Create exampl/benchmark-analysis.json with timing/cost metrics.
      Update README with e2e test instructions.
