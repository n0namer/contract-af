      Test cases:
        - POST /analyze with text file -> returns job_id
        - GET /analyze/{job_id} -> returns status
        - Document loader: PDF extraction
        - Document loader: DOCX extraction
        - Document loader: plain text
        - Health endpoint returns 200
        - Invalid file type returns 400
        - Missing file returns 400

  # === LAYER 6: Sample data and documentation ===

  - id: sample-contracts
    title: "Create sample contract fixtures for testing and demos"
    kind: research
    priority: 85
    deps: [{ from: scaffold, kind: feeds_into }]
    description: |
      Create realistic sample contract text for testing all pipeline phases.

      Files:
        - tests/fixtures/sample_nda.txt (~3 pages, simple)
        - tests/fixtures/sample_saas_agreement.txt (~20 pages, standard complexity)
        - tests/fixtures/sample_employment.txt (~15 pages, IP/non-compete heavy)

      Each fixture should have:
        - Realistic section structure (numbered sections, subsections)
        - Definitions section with defined terms
        - Cross-references between sections
        - At least 3 intentional risks to find:
          - One obvious (broad non-compete, unlimited liability)
          - One hidden (definition scope issue, survival clause trap)
          - One combination (two clauses interacting badly)
        - Standard boilerplate (notices, counterparts, amendments)

      These are TEXT representations, not actual legal documents.
      They should be detailed enough to exercise all pipeline phases.

      Acceptance criteria:
        - Each fixture is realistic and well-structured
        - Known risks are documented (for test assertions)
        - Cross-references are internally consistent
        - Defined terms are used consistently
