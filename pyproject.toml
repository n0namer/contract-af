[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "contract-af"
version = "0.1.0"
description = "Legal contract risk analyzer — finds dangerous clauses, proves exploitability"
requires-python = ">=3.10"
dependencies = [
    "agentfield",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-docx>=0.8",
    "pdfplumber>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "httpx>=0.24",
]

[project.scripts]
contract-af = "contract_af.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring AgentField",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
